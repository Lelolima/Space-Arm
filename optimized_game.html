<!DOCTYPE html>
<html>
<head>
    <title>Optimized Space Combat Game</title>
    <style>
        body {
            font-family: 'Orbitron', sans-serif;
            background-color: #0a0a1a;
            color: #e0e0ff;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100vh;
            margin: 0;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400"><rect width="400" height="400" fill="%230a0a1a"/><g fill="%23ffffff" opacity="0.3"><circle cx="25" cy="25" r="1"/><circle cx="75" cy="50" r="0.8"/><circle cx="125" cy="100" r="1.2"/><circle cx="175" cy="150" r="0.6"/><circle cx="225" cy="200" r="1"/><circle cx="275" cy="250" r="0.7"/><circle cx="325" cy="300" r="1.1"/><circle cx="375" cy="350" r="0.9"/><circle cx="50" cy="375" r="0.8"/><circle cx="100" cy="325" r="1"/><circle cx="150" cy="275" r="0.7"/><circle cx="200" cy="225" r="1.2"/><circle cx="250" cy="175" r="0.6"/><circle cx="300" cy="125" r="1"/><circle cx="350" cy="75" r="0.9"/><circle cx="40" cy="40" r="0.4" fill="%234080ff"/><circle cx="120" cy="160" r="0.3" fill="%234080ff"/><circle cx="280" cy="220" r="0.5" fill="%234080ff"/><circle cx="350" cy="350" r="0.4" fill="%234080ff"/></g></svg>');
            background-repeat: repeat;
            animation: space-move 60s linear infinite;
            position: relative;
        }

        /* Add nebula effects in the background */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(64, 0, 128, 0.15) 0%, rgba(64, 0, 128, 0) 50%),
                radial-gradient(circle at 80% 70%, rgba(0, 64, 128, 0.15) 0%, rgba(0, 64, 128, 0) 50%),
                radial-gradient(circle at 50% 50%, rgba(128, 0, 64, 0.1) 0%, rgba(128, 0, 64, 0) 60%);
            pointer-events: none;
            z-index: -1;
        }

        @keyframes space-move {
            from { background-position: 0 0; }
            to { background-position: 1000px 1000px; }
        }

        #game-container {
            display: flex;
            flex-direction: column;
            height: 100%;
            width: 100%;
            position: relative;
        }

        #game-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        #map-canvas {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 200px;
            height: 200px;
            border: 2px solid rgba(64, 128, 255, 0.7);
            border-radius: 5px;
            background-color: rgba(0, 10, 30, 0.7);
            z-index: 2;
        }

        #hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 10px;
            display: flex;
            justify-content: space-between;
            z-index: 3;
        }

        .hud-section {
            background-color: rgba(0, 10, 30, 0.7);
            border: 1px solid rgba(64, 128, 255, 0.7);
            border-radius: 5px;
            padding: 10px;
            margin: 5px;
        }

        #loading-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 30, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        #loading-progress {
            width: 300px;
            height: 20px;
            background-color: rgba(64, 128, 255, 0.3);
            border-radius: 10px;
            margin-top: 20px;
            overflow: hidden;
        }

        #progress-bar {
            height: 100%;
            width: 0%;
            background-color: #4080ff;
            transition: width 0.3s ease;
        }

        #start-button {
            margin-top: 30px;
            padding: 15px 30px;
            font-size: 1.2em;
            background-color: #1a1a4a;
            color: #e0e0ff;
            border: 2px solid #4080ff;
            border-radius: 10px;
            cursor: pointer;
            font-family: 'Orbitron', sans-serif;
            transition: all 0.3s ease;
            display: none;
        }

        #start-button:hover {
            background-color: #2a2a6a;
            transform: scale(1.05);
        }

        #performance-options {
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: rgba(0, 10, 30, 0.7);
            border: 1px solid rgba(64, 128, 255, 0.7);
            border-radius: 5px;
            padding: 10px;
            z-index: 4;
        }

        .option-toggle {
            margin: 5px 0;
            display: flex;
            align-items: center;
        }

        .option-toggle label {
            margin-left: 10px;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas"></canvas>
        <canvas id="map-canvas"></canvas>
        
        <div id="hud">
            <div class="hud-section">
                <div id="score">Score: 0</div>
                <div id="level">Level: 1</div>
            </div>
            <div class="hud-section">
                <div id="shield">Shield: 100%</div>
                <div id="weapon">Weapon: Standard Laser</div>
            </div>
        </div>
        
        <div id="performance-options">
            <h3>Performance Options</h3>
            <div class="option-toggle">
                <input type="checkbox" id="particle-limit" checked>
                <label for="particle-limit">Limit Particles</label>
            </div>
            <div class="option-toggle">
                <input type="checkbox" id="occlusion" checked>
                <label for="occlusion">Enable Occlusion</label>
            </div>
            <div class="option-toggle">
                <input type="checkbox" id="fps-counter" checked>
                <label for="fps-counter">Show FPS Counter</label>
            </div>
        </div>
        
        <div id="loading-screen">
            <h1>OPTIMIZED SPACE COMBAT</h1>
            <p>Loading game resources...</p>
            <div id="loading-progress">
                <div id="progress-bar"></div>
            </div>
            <button id="start-button">START GAME</button>
        </div>
    </div>

    <!-- Load game scripts -->
    <script src="enhanced_physics.js"></script>
    <script src="game_assets.js"></script>
    <script src="space_arm_movement_enhanced.js"></script>
    <script src="interactive_map.js"></script>
    <script src="optimized_game_launcher.js"></script>
    
    <script>
        // Initialize game when all resources are loaded
        document.addEventListener('DOMContentLoaded', function() {
            // Simulate loading progress
            let progress = 0;
            const progressBar = document.getElementById('progress-bar');
            const loadingScreen = document.getElementById('loading-screen');
            const startButton = document.getElementById('start-button');
            
            const loadingInterval = setInterval(() => {
                progress += 5;
                progressBar.style.width = `${progress}%`;
                
                if (progress >= 100) {
                    clearInterval(loadingInterval);
                    startButton.style.display = 'block';
                }
            }, 100);
            
            // Setup performance option toggles
            const particleLimitToggle = document.getElementById('particle-limit');
            const occlusionToggle = document.getElementById('occlusion');
            const fpsCounterToggle = document.getElementById('fps-counter');
            
            // Initialize game launcher
            const gameLauncher = new OptimizedGameLauncher();
            
            // Apply performance settings from toggles
            particleLimitToggle.addEventListener('change', function() {
                gameLauncher.settings.enableParticleLimit = this.checked;
            });
            
            occlusionToggle.addEventListener('change', function() {
                gameLauncher.settings.enableOcclusion = this.checked;
            });
            
            fpsCounterToggle.addEventListener('change', function() {
                gameLauncher.settings.enableFpsCounter = this.checked;
                if (gameLauncher.fpsElement) {
                    gameLauncher.fpsElement.style.display = this.checked ? 'block' : 'none';
                }
            });
            
            // Start game when button is clicked
            startButton.addEventListener('click', function() {
                loadingScreen.style.display = 'none';
                gameLauncher.init();
            });
        });
    </script>
</body>
</html>

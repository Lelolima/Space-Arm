name: CI

on:
  push:
    branches: [principal]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      # Sem etapa de build: o jogo roda direto no navegador.
      - run: npm ci
      - run: npm test
      # Chrome headless (google-chrome já vem instalado no ubuntu-latest)
      - run: npm run test:browser
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Sintaxe do protótipo Panda3D
        run: python -m py_compile space_arm_panda3d.py

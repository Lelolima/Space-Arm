<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Combat - Sistema de Movimento</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000;
            font-family: Arial, sans-serif;
            color: #fff;
        }
        
        #game-canvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        
        #minimap {
            position: absolute;
            bottom: 20px;
            right: 20px;
            border: 2px solid #fff;
            z-index: 2;
        }
        
        .touch-controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            display: flex;
            flex-wrap: wrap;
            width: 200px;
            z-index: 3;
        }
        
        .touch-btn {
            width: 60px;
            height: 60px;
            margin: 5px;
            background-color: rgba(255, 255, 255, 0.2);
            border: 2px solid #fff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            font-weight: bold;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        
        .touch-fire {
            background-color: rgba(255, 0, 0, 0.3);
        }
        
        .arrow-up, .arrow-down, .arrow-left, .arrow-right {
            width: 0;
            height: 0;
            border-style: solid;
        }
        
        .arrow-up {
            border-width: 0 10px 15px 10px;
            border-color: transparent transparent #fff transparent;
        }
        
        .arrow-down {
            border-width: 15px 10px 0 10px;
            border-color: #fff transparent transparent transparent;
        }
        
        .arrow-left {
            border-width: 10px 15px 10px 0;
            border-color: transparent #fff transparent transparent;
        }
        
        .arrow-right {
            border-width: 10px 0 10px 15px;
            border-color: transparent transparent transparent #fff;
        }
        
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        
        #loading-bar {
            width: 300px;
            height: 20px;
            background-color: #333;
            margin-top: 20px;
            border-radius: 10px;
            overflow: hidden;
        }
        
        #progress-bar {
            height: 100%;
            width: 0%;
            background-color: #2196F3;
            transition: width 0.3s;
        }
        
        #game-title {
            font-size: 36px;
            margin-bottom: 20px;
            color: #2196F3;
            text-shadow: 0 0 10px rgba(33, 150, 243, 0.7);
        }
        
        #game-info {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 2;
            background-color: rgba(0, 0, 0, 0.5);
            padding: 10px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div id="loading-screen">
        <h1 id="game-title">SPACE COMBAT</h1>
        <p>Carregando sistema de navegação...</p>
        <div id="loading-bar">
            <div id="progress-bar"></div>
        </div>
    </div>
    
    <div id="game-info">
        <div>Velocidade: <span id="speed-info">0</span></div>
        <div>Posição: <span id="position-info">0,0</span></div>
        <div>Inimigos: <span id="enemies-info">0</span></div>
    </div>
    
    <canvas id="game-canvas"></canvas>
    <canvas id="minimap"></canvas>
    
    <script src="game_assets.js"></script>
    <script src="space_arm_movement.js"></script>

            const backgroundImg = new Image();
            backgroundImg.src = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==';
            
            return {
                spaceship: spaceshipImg,
                background: backgroundImg
            };
        }
        
        // Criar assets antes de inicializar o jogo
        const gameAssets = createAssetPlaceholders();
        
        // Inicializar tela de carregamento
        const loadingScreen = document.getElementById('loading-screen');
        const progressBar = document.getElementById('progress-bar');
        let progress = 0;
        
        const loadingInterval = setInterval(() => {
            progress += 5;
            progressBar.style.width = `${progress}%`;
            
            if (progress >= 100) {
                clearInterval(loadingInterval);
                setTimeout(() => {
                    loadingScreen.style.display = 'none';
                    initGame();
                }, 500);
            }
        }, 100);
        
        // Inicializar jogo
        function initGame() {
            const gameCanvas = document.getElementById('game-canvas');
            const minimap = document.getElementById('minimap');
            const speedInfo = document.getElementById('speed-info');
            const positionInfo = document.getElementById('position-info');
            const enemiesInfo = document.getElementById('enemies-info');
            
            // Modificar o SpaceshipController para usar os assets criados
            const originalSpaceshipImage = SpaceshipController.prototype.spaceshipImage;
            const originalBackgroundImage = SpaceshipController.prototype.backgroundImage;
            
            // Sobrescrever as propriedades de imagem com nossos placeholders
            SpaceshipController.prototype.spaceshipImage = gameAssets.spaceship;
            SpaceshipController.prototype.backgroundImage = gameAssets.background;
            
            // Criar controlador da nave
            const controller = new SpaceshipController(gameCanvas, minimap);
            
            // Atualizar informações na interface
            setInterval(() => {
                const speed = Math.sqrt(
                    controller.spaceship.velocity.x ** 2 + 
                    controller.spaceship.velocity.y ** 2
                ).toFixed(2);
                
                speedInfo.textContent = speed;
                positionInfo.textContent = `${Math.round(controller.spaceship.x)},${Math.round(controller.spaceship.y)}`;
                enemiesInfo.textContent = controller.enemies.length;
            }, 100);
            
            // Adicionar controles de toque para dispositivos móveis
            if ('ontouchstart' in window) {
                document.querySelector('.touch-controls').style.display = 'flex';
            }
        }
    </script>
</body>
</html>
